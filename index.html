<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corso di Italiano — learn Italian verbs</title>
    <style>
      :root {
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --color-text-primary: #0f172a;
        --color-text-secondary: #64748b;
        --color-background-primary: #ffffff;
        --color-background-secondary: #f1f6fb;
        --color-background-tint: #eff6ff;
        --color-border-primary: #c7d2e0;
        --color-border-secondary: #dbe4ee;
        --color-border-tertiary: #e8eef5;

        --color-primary: #2563eb;
        --color-primary-hover: #1d4ed8;
        --color-primary-active: #1e40af;
        --color-primary-soft: #dbeafe;
        --color-primary-softer: #eff6ff;
        --color-primary-ring: rgba(37, 99, 235, 0.35);

        --color-success: #059669;
        --color-success-soft: #d1fae5;
        --color-danger: #dc2626;
        --color-danger-hover: #b91c1c;
        --color-danger-soft: #fee2e2;

        /* Text/icon colour on a filled primary surface. */
        --color-on-primary: #ffffff;
        /* Modal and full-screen overlay wash. */
        --color-scrim: rgba(15, 23, 42, 0.55);

        /* Section accents (main menu cards). */
        --color-accent-verbs: #2563eb;
        --color-accent-conversation: #8b5cf6;
        --color-accent-settings: #64748b;

        /* Italian tricolour, used as a brand mark only — never as UI state. */
        --color-flag-green: #009246;
        --color-flag-white: #ffffff;
        --color-flag-red: #ce2b37;

        /* Correction banner in chat: "ok" for a confirmation, "note" for a fix. */
        --color-correction-ok-bg: #e8f5e9;
        --color-correction-ok-border: #a5d6a7;
        --color-correction-ok-text: #2e7d32;
        --color-correction-note-bg: #fff8e6;
        --color-correction-note-border: #e8d48a;
        --color-correction-note-text: #6b5a00;

        /* Categorical verb-badge palette, assigned by verb id (see config.ts). */
        --color-badge-1-bg: #eeedfe; --color-badge-1-fg: #3c3489;
        --color-badge-2-bg: #e1f5ee; --color-badge-2-fg: #0f6e56;
        --color-badge-3-bg: #faece7; --color-badge-3-fg: #993c1d;
        --color-badge-4-bg: #e6f1fb; --color-badge-4-fg: #185fa5;
        --color-badge-5-bg: #fff8e6; --color-badge-5-fg: #6b5a00;
        --color-badge-6-bg: #f3e8ff; --color-badge-6-fg: #6b21a8;
        --color-badge-7-bg: #fce7f3; --color-badge-7-fg: #9d174d;
        --color-badge-8-bg: #ecfdf5; --color-badge-8-fg: #065f46;

        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
        --shadow-md: 0 4px 14px rgba(37, 99, 235, 0.12);
        --shadow-lg: 0 18px 40px rgba(15, 23, 42, 0.18);
      }
      [data-theme="dark"] {
        --color-text-primary: #e2e8f0;
        --color-text-secondary: #94a3b8;
        --color-background-primary: #111827;
        --color-background-secondary: #0b1220;
        --color-background-tint: #15213a;
        --color-border-primary: #334155;
        --color-border-secondary: #283449;
        --color-border-tertiary: #1f2a3d;

        --color-primary: #60a5fa;
        --color-primary-hover: #3b82f6;
        --color-primary-active: #2563eb;
        --color-primary-soft: #1e3a8a;
        --color-primary-softer: #172554;
        --color-primary-ring: rgba(96, 165, 250, 0.4);

        --color-success: #10b981;
        --color-success-soft: #064e3b;
        --color-danger: #f87171;
        --color-danger-hover: #ef4444;
        --color-danger-soft: #7f1d1d;

        /* The dark primary (#60a5fa) is light: white text on it fails contrast,
           so the on-primary colour flips to near-black here. */
        --color-on-primary: #0b1220;
        --color-scrim: rgba(0, 0, 0, 0.65);

        --color-accent-verbs: #60a5fa;
        --color-accent-conversation: #a78bfa;
        --color-accent-settings: #94a3b8;

        /* The flag is the flag in both themes. */
        --color-flag-green: #009246;
        --color-flag-white: #ffffff;
        --color-flag-red: #ce2b37;

        --color-correction-ok-bg: #0d3f22;
        --color-correction-ok-border: #2f6f45;
        --color-correction-ok-text: #a7e5bd;
        --color-correction-note-bg: #3b3210;
        --color-correction-note-border: #7a6714;
        --color-correction-note-text: #ecd98f;

        --color-badge-1-bg: #2a2470; --color-badge-1-fg: #c5bffb;
        --color-badge-2-bg: #0c3f33; --color-badge-2-fg: #8fe0c9;
        --color-badge-3-bg: #4a2114; --color-badge-3-fg: #f0b9a2;
        --color-badge-4-bg: #12395f; --color-badge-4-fg: #a8d0f5;
        --color-badge-5-bg: #40350a; --color-badge-5-fg: #e8d48a;
        --color-badge-6-bg: #3d1a63; --color-badge-6-fg: #d6b4f7;
        --color-badge-7-bg: #521030; --color-badge-7-fg: #f6b0cf;
        --color-badge-8-bg: #083b2a; --color-badge-8-fg: #86dfb8;

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 18px 40px rgba(0, 0, 0, 0.55);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: var(--font-sans);
        background:
          radial-gradient(1200px 600px at 10% -10%, var(--color-primary-softer), transparent 60%),
          radial-gradient(900px 500px at 110% 10%, var(--color-background-tint), transparent 55%),
          var(--color-background-secondary);
        color: var(--color-text-primary);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      #root { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
      .tricolore {
        height: 4px;
        background: linear-gradient(90deg, #009246 33.3%, #fff 33.3%, #fff 66.6%, #CE2B37 66.6%);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
      }

      /* Friendly buttons --------------------------------------------------- */
      button {
        font-family: inherit;
        transition:
          background-color 0.18s ease,
          border-color 0.18s ease,
          color 0.18s ease,
          box-shadow 0.18s ease,
          transform 0.08s ease;
      }
      button:focus { outline: none; }
      button:focus-visible {
        box-shadow: 0 0 0 3px var(--color-primary-ring);
      }
      button:not(:disabled):active { transform: translateY(1px); }

      .btn-primary {
        background: var(--color-primary) !important;
        color: #fff !important;
        border: none !important;
        box-shadow: var(--shadow-md);
      }
      .btn-primary:not(:disabled):hover {
        background: var(--color-primary-hover) !important;
        box-shadow: 0 8px 22px rgba(37, 99, 235, 0.28);
      }
      .btn-primary:not(:disabled):active {
        background: var(--color-primary-active) !important;
      }
      .btn-primary:disabled {
        background: var(--color-border-secondary) !important;
        color: var(--color-text-secondary) !important;
        box-shadow: none;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: var(--color-background-primary) !important;
        color: var(--color-text-primary) !important;
        border: 1px solid var(--color-border-secondary) !important;
      }
      .btn-secondary:not(:disabled):hover {
        background: var(--color-primary-softer) !important;
        border-color: var(--color-primary) !important;
        color: var(--color-primary-hover) !important;
      }

      .btn-ghost {
        background: transparent !important;
        color: var(--color-text-secondary) !important;
        border: 1px solid transparent !important;
      }
      .btn-ghost:not(:disabled):hover {
        background: var(--color-primary-softer) !important;
        color: var(--color-primary-hover) !important;
      }

      .btn-danger {
        background: transparent !important;
        color: var(--color-danger) !important;
        border: 1px solid var(--color-danger-soft) !important;
      }
      .btn-danger:not(:disabled):hover {
        background: var(--color-danger-soft) !important;
        color: var(--color-danger-hover) !important;
        border-color: var(--color-danger) !important;
      }
      .btn-danger-solid {
        background: var(--color-danger) !important;
        color: #fff !important;
        border: none !important;
        box-shadow: var(--shadow-sm);
      }
      .btn-danger-solid:not(:disabled):hover {
        background: var(--color-danger-hover) !important;
      }

      /* Inputs ------------------------------------------------------------- */
      textarea, input[type="text"] {
        font-family: inherit;
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
      }
      textarea:focus, input[type="text"]:focus {
        outline: none;
        border-color: var(--color-primary) !important;
        box-shadow: 0 0 0 3px var(--color-primary-ring);
      }

      /* Subtle fade-in for screen transitions */
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .fade-in { animation: fade-in 0.28s ease both; }
    </style>
  </head>
  <body>
    <div class="tricolore" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
