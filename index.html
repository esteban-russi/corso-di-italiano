<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corso di Italiano — learn Italian verbs</title>
    <style>
      @font-face {
        font-family: "DM Serif Display";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/dm-serif-display-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "DM Serif Display";
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/dm-serif-display-italic-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Work Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/work-sans-var-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        --font-serif: "DM Serif Display", Georgia, serif;
        --font-sans: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --color-text-primary: #1c1a17;
        --color-text-secondary: #686157;
        --color-background-primary: #fbf8f2;
        --color-background-secondary: #f3eee4;
        --color-background-tint: #ebe3d5;
        --color-border-primary: #d6cdbd;
        --color-border-secondary: #e2dbcd;
        --color-border-tertiary: #ebe4d7;

        --color-primary: #b8202a;
        --color-primary-text: #b8202a;
        --color-primary-hover: #9e1a23;
        --color-primary-active: #84141c;
        --color-primary-soft: #fae6e7;
        --color-primary-softer: #fdf4f4;
        --color-primary-ring: rgba(184, 32, 42, 0.35);

        --color-success: #255c34;
        --color-success-soft: #e4ede0;
        --color-danger: #b8202a;
        --color-danger-hover: #9e1a23;
        --color-danger-soft: #fae6e7;

        /* Text/icon colour on a filled primary surface. */
        --color-on-primary: #fbf8f2;
        /* Text/icon colour on a filled danger surface. */
        --color-on-danger: #fbf8f2;
        /* Lift under a hovered primary button. */
        --shadow-primary-hover: 0 8px 22px rgba(184, 32, 42, 0.28);
        /* Modal and full-screen overlay wash. */
        --color-scrim: rgba(28, 26, 23, 0.6);

        /* Section accents (main menu cards). */
        --color-accent-verbs: #b8202a;
        --color-accent-conversation: #1c1a17;
        --color-accent-settings: #686157;

        /* Italian tricolour, used as a brand mark only — never as UI state. */
        --color-flag-green: #009246;
        --color-flag-white: #ffffff;
        --color-flag-red: #ce2b37;

        /* Correction banner in chat: "ok" for a confirmation, "note" for a fix. */
        --color-correction-ok-bg: #e4ede0;
        --color-correction-ok-border: #2f6a3d;
        --color-correction-ok-text: #1b4425;
        --color-correction-note-bg: #fbf5e6;
        --color-correction-note-border: #d8bf75;
        --color-correction-note-text: #5f4f00;

        /* Categorical verb-badge palette, assigned by verb id (see config.ts). */
        --color-badge-1-bg: #eeedfe; --color-badge-1-fg: #3c3489;
        --color-badge-2-bg: #e1f5ee; --color-badge-2-fg: #0f6e56;
        --color-badge-3-bg: #faece7; --color-badge-3-fg: #993c1d;
        --color-badge-4-bg: #e6f1fb; --color-badge-4-fg: #185fa5;
        --color-badge-5-bg: #fff8e6; --color-badge-5-fg: #6b5a00;
        --color-badge-6-bg: #f3e8ff; --color-badge-6-fg: #6b21a8;
        --color-badge-7-bg: #fce7f3; --color-badge-7-fg: #9d174d;
        --color-badge-8-bg: #ecfdf5; --color-badge-8-fg: #065f46;

        --shadow-sm: 0 1px 2px rgba(28, 26, 23, 0.06);
        --shadow-md: 0 4px 14px rgba(184, 32, 42, 0.12);
        --shadow-lg: 0 18px 40px rgba(28, 26, 23, 0.18);
      }
      [data-theme="dark"] {
        --color-text-primary: #efe8da;
        --color-text-secondary: #a89f90;
        --color-background-primary: #24211c;
        --color-background-secondary: #1a1815;
        --color-background-tint: #2e2a24;
        --color-border-primary: #3d382f;
        --color-border-secondary: #4d473c;
        --color-border-tertiary: #343028;

        --color-primary: #cb353f;
        --color-primary-text: #ec6c66;
        --color-primary-hover: #b02830;
        --color-primary-active: #991f26;
        --color-primary-soft: #3f1b1e;
        --color-primary-softer: #2e1416;
        --color-primary-ring: rgba(236, 108, 102, 0.4);

        --color-success: #6fb07f;
        --color-success-soft: #1a3322;
        --color-danger: #ec6c66;
        --color-danger-hover: #f87171;
        --color-danger-soft: #451719;

        --color-on-primary: #f7f1e5;
        --color-on-danger: #1a1815;
        --shadow-primary-hover: 0 8px 22px rgba(0, 0, 0, 0.5);
        --color-scrim: rgba(0, 0, 0, 0.7);

        --color-accent-verbs: #ec6c66;
        --color-accent-conversation: #efe8da;
        --color-accent-settings: #a89f90;

        /* The flag is the flag in both themes. */
        --color-flag-green: #009246;
        --color-flag-white: #ffffff;
        --color-flag-red: #ce2b37;

        --color-correction-ok-bg: #1f3024;
        --color-correction-ok-border: #6fb07f;
        --color-correction-ok-text: #a9dbb3;
        --color-correction-note-bg: #383015;
        --color-correction-note-border: #d8bf75;
        --color-correction-note-text: #f2dd96;

        --color-badge-1-bg: #2a2470; --color-badge-1-fg: #c5bffb;
        --color-badge-2-bg: #0c3f33; --color-badge-2-fg: #8fe0c9;
        --color-badge-3-bg: #4a2114; --color-badge-3-fg: #f0b9a2;
        --color-badge-4-bg: #12395f; --color-badge-4-fg: #a8d0f5;
        --color-badge-5-bg: #40350a; --color-badge-5-fg: #e8d48a;
        --color-badge-6-bg: #3d1a63; --color-badge-6-fg: #d6b4f7;
        --color-badge-7-bg: #521030; --color-badge-7-fg: #f6b0cf;
        --color-badge-8-bg: #083b2a; --color-badge-8-fg: #86dfb8;

        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-md: 0 6px 18px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 18px 40px rgba(0, 0, 0, 0.55);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: var(--font-sans);
        /* Mobile browser chrome makes 100vh taller than the visible area, so the
           page ends up scrollable by the height of the toolbar. dvh tracks the
           real viewport; the vh line stays as the fallback. */
        min-height: 100vh;
        min-height: 100dvh;
        overscroll-behavior-y: contain;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        background:
          radial-gradient(1200px 600px at 10% -10%, var(--color-primary-softer), transparent 60%),
          radial-gradient(900px 500px at 110% 10%, var(--color-background-tint), transparent 55%),
          var(--color-background-secondary);
        color: var(--color-text-primary);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        max-width: 720px;
        margin: 0 auto;
        /* Respect the notch and the home indicator when installed. */
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          calc(48px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      @media (max-width: 480px) {
        #root { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
      }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
      .tricolore {
        height: 4px;
        background: linear-gradient(
          90deg,
          var(--color-flag-green) 33.3%,
          var(--color-flag-white) 33.3%,
          var(--color-flag-white) 66.6%,
          var(--color-flag-red) 66.6%
        );
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
      }

      /* Friendly buttons --------------------------------------------------- */
      button {
        font-family: inherit;
        /* Removes the 300ms tap delay and the grey flash on iOS. */
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition:
          background-color 0.18s ease,
          border-color 0.18s ease,
          color 0.18s ease,
          box-shadow 0.18s ease,
          transform 0.08s ease;
      }
      button:focus { outline: none; }
      button:focus-visible {
        box-shadow: 0 0 0 3px var(--color-primary-ring);
      }
      button:not(:disabled):active { transform: translateY(1px); }

      .btn-primary {
        background: var(--color-primary) !important;
        color: var(--color-on-primary) !important;
        border: none !important;
        box-shadow: var(--shadow-md);
      }
      .btn-primary:not(:disabled):hover {
        background: var(--color-primary-hover) !important;
        box-shadow: var(--shadow-primary-hover);
      }
      .btn-primary:not(:disabled):active {
        background: var(--color-primary-active) !important;
      }
      .btn-primary:disabled {
        background: var(--color-border-secondary) !important;
        color: var(--color-text-secondary) !important;
        box-shadow: none;
        cursor: not-allowed;
      }

      .btn-secondary {
        background: var(--color-background-primary) !important;
        color: var(--color-text-primary) !important;
        border: 1px solid var(--color-border-secondary) !important;
      }
      .btn-secondary:not(:disabled):hover {
        background: var(--color-primary-softer) !important;
        border-color: var(--color-primary) !important;
        color: var(--color-primary-hover) !important;
      }

      .btn-ghost {
        background: transparent !important;
        color: var(--color-text-secondary) !important;
        border: 1px solid transparent !important;
      }
      .btn-ghost:not(:disabled):hover {
        background: var(--color-primary-softer) !important;
        color: var(--color-primary-hover) !important;
      }

      .btn-danger {
        background: transparent !important;
        color: var(--color-danger) !important;
        border: 1px solid var(--color-danger-soft) !important;
      }
      .btn-danger:not(:disabled):hover {
        background: var(--color-danger-soft) !important;
        color: var(--color-danger-hover) !important;
        border-color: var(--color-danger) !important;
      }
      .btn-danger-solid {
        background: var(--color-danger) !important;
        color: var(--color-on-danger) !important;
        border: none !important;
        box-shadow: var(--shadow-sm);
      }
      .btn-danger-solid:not(:disabled):hover {
        background: var(--color-danger-hover) !important;
      }

      /* Inputs ------------------------------------------------------------- */
      textarea, input[type="text"] {
        font-family: inherit;
        transition: border-color 0.18s ease, box-shadow 0.18s ease;
      }
      textarea:focus, input[type="text"]:focus {
        outline: none;
        border-color: var(--color-primary) !important;
        box-shadow: 0 0 0 3px var(--color-primary-ring);
      }

      /* Subtle fade-in for screen transitions */
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .fade-in { animation: fade-in 0.28s ease both; }
    </style>
  </head>
  <body>
    <div class="tricolore" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
