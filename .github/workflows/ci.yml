# The project's automated CI/CD pipeline.
# - Runs typecheck, tests, bundle budget check, and Playwright e2e tests (when present).
# - On every push to `main` (after checks pass), deploys to Google Cloud Run via Workload Identity Federation.
name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GCP_PROJECT: ${{ vars.GCP_PROJECT || 'corso-di-italiano-496920' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
  CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'corso-di-italiano' }}
  ARTIFACT_REGISTRY_REPO: ${{ vars.ARTIFACT_REGISTRY_REPO || 'corso-di-italiano' }}

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Type check
        run: |
          if npm run | grep -q ' typecheck$'; then
            npm run typecheck
          else
            npx tsc --noEmit
          fi

      - name: Unit tests
        run: |
          if npm run | grep -q ' test$'; then
            npm test
          else
            echo "No test script configured, skipping unit tests."
          fi

      - name: Build SPA
        run: npm run build

      - name: E2E tests
        run: |
          if [ -f "playwright.config.ts" ]; then
            npx playwright install --with-deps chromium
            npm run e2e
          else
            echo "No Playwright configuration found, skipping E2E tests."
          fi

      - name: Check JS bundle budget
        run: |
          if [ -d "dist/assets" ]; then
            budget_kb=200
            total=$(find dist/assets -name '*.js' -exec gzip -c {} \; | wc -c)
            total_kb=$(( total / 1024 ))
            echo "gzipped JS: ${total_kb} KB (budget ${budget_kb} KB)"
            if [ "$total_kb" -gt "$budget_kb" ]; then
              echo "::error::JS bundle is ${total_kb} KB gzipped, over the ${budget_kb} KB budget"
              exit 1
            fi
          fi

  deploy:
    name: Deploy to Cloud Run
    needs: [check]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.CLOUD_RUN_SERVICE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --port=8080
            --memory=512Mi
            --cpu=1
            --concurrency=80
            --min-instances=0
            --max-instances=3
          env_vars: ${{ secrets.GEMINI_API_KEY != '' && format('GEMINI_API_KEY={0}', secrets.GEMINI_API_KEY) || '' }}

      - name: Cloud Run deployment summary
        run: |
          echo "### :rocket: Cloud Run Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Service URL:** [${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** \`${{ env.GCP_REGION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
